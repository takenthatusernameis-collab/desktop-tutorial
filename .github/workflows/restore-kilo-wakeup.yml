name: Restore kilo-wakeup workflow
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-kilo-wakeup.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore full workflow from last good commit and apply fix
        run: |
          set -euo pipefail
          git show 0b81140b2a8573f08ca2b035797b906d2bca82d3:.github/workflows/kilo-wakeup.yml > /tmp/orig.yml
          test -s /tmp/orig.yml
          python3 - <<'PY'
          import base64
          from pathlib import Path
          orig = Path("/tmp/orig.yml").read_text()
          old = base64.b64decode("").decode()
          new = base64.b64decode("").decode()
          if old not in orig:
              raise SystemExit("old inventory block not found")
          fixed = orig.replace(old, new, 1)
          Path(".github/workflows/kilo-wakeup.yml").write_text(fixed)
          print("wrote fixed kilo-wakeup.yml", len(fixed))
          assert "INVENTORY_RC=" in fixed
          assert "untracked-files=no" in fixed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/kilo-wakeup.yml
          git status --short
          git commit -m "Harden Report worker outcome: GENERATIONS inventory must not exit 2"
          git push origin HEAD:main
      - name: Remove one-shot restore workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -f .github/workflows/restore-kilo-wakeup.yml ]; then
            git rm -f .github/workflows/restore-kilo-wakeup.yml
            git commit -m "Remove one-shot restore workflow" || exit 0
            git push origin HEAD:main || true
          fi
