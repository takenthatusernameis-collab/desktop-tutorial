name: Bug Bounty Research Enterprise — Fast Dummy Smoke

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kilo-smoke-dummy.yml"
      - ".github/scripts/run_security_campaign.sh"
      - ".github/scripts/campaign_controller.py"
      - ".github/scripts/finalize_campaign.py"
      - ".github/scripts/mock_kilo_session.sh"
      - ".github/scripts/build_campaign_health.py"
      - "lab/generate_solver_feedback.py"
      - ".kilo/wakeup-prompt.md"

concurrency:
  group: bug-bounty-research-enterprise-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  controller-smoke:
    name: Fast 10-agent controller smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BENCHMARK_ID: dummy-smoke
      SECURITY_RESEARCH_TARGET: authorized-smoke-fixture
      CAMPAIGN_DUMMY: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate controller scripts
        run: |
          set -euo pipefail
          bash -n .github/scripts/run_security_campaign.sh
          python3 -m py_compile \
            .github/scripts/campaign_controller.py \
            .github/scripts/finalize_campaign.py \
            .github/scripts/build_campaign_health.py \
            lab/generate_solver_feedback.py \
            lab/research_program.py \
            .github/scripts/report_worker_outcome.py \
            .github/scripts/record_failure_memory.py
          python3 .github/scripts/build_campaign_health.py --help >/dev/null
          python3 .github/scripts/report_worker_outcome.py --self-test
          python3 .github/scripts/record_failure_memory.py --self-test

      - name: Regression-test result contract and secret scanner
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/result-contract-test"
          TEST_CONTEXT="$RUNNER_TEMP/result-contract-context"
          rm -rf "$TEST_ROOT" "$TEST_CONTEXT"
          mkdir -p "$TEST_ROOT/state/campaign" "$TEST_CONTEXT"

          cat > "$TEST_ROOT/state/campaign/GLOBAL_AGENT_COUNTER.json" <<'EOF'
          {
            "schema_version": 1,
            "next_agent_number": 41,
            "last_reserved_campaign_id": null,
            "last_reserved_ending_agent_number": 40
          }
          EOF

          python3 .github/scripts/campaign_controller.py start-campaign             --root "$TEST_ROOT" --campaign-id result-contract-smoke >/dev/null
          python3 .github/scripts/campaign_controller.py prepare-agent             --root "$TEST_ROOT"             --agent-root "$TEST_ROOT"             --context-dir "$TEST_CONTEXT"             --campaign-slot 1 >/dev/null

          test -s "$TEST_ROOT/state/campaign/RESULT.md"
          for field in             OUTCOME_CLASS: TASK_ID: PRIMARY_QUESTION: BOTTLENECK: INFORMATION_GAP:             BOUNDED_ACTION: DELIVERABLE: SUCCESS_EVIDENCE_CRITERION: STOP_CONDITION:             OUT_OF_SCOPE: VERIFICATION_REQUIREMENT: CHANGED: VERIFIED: UNVERIFIED:             OBSERVED_EFFECT: UNCERTAINTY_TARGETED: UNCERTAINTY_REDUCED: DECISION: NEXT:; do
            grep -Fq "$field" "$TEST_ROOT/state/campaign/RESULT.md"
          done

          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "result-contract-test"
          task_path = root / "state/campaign/TASK.json"
          result_path = root / "state/campaign/RESULT.md"
          task = json.loads(task_path.read_text(encoding="utf-8"))

          result = [
              "OUTCOME_CLASS: NEW_EVIDENCE",
              f"TASK_ID: {task['task_id']}",
              f"PRIMARY_QUESTION: {task['primary_question']}",
              f"BOTTLENECK: {task['bottleneck']}",
              f"INFORMATION_GAP: {task['information_gap']}",
              f"BOUNDED_ACTION: {task['bounded_action']}",
              f"DELIVERABLE: {task['deliverable']}",
              f"SUCCESS_EVIDENCE_CRITERION: {task['success_evidence_criterion']}",
              f"STOP_CONDITION: {task['stop_condition']}",
              f"OUT_OF_SCOPE: {task['out_of_scope']}",
              f"VERIFICATION_REQUIREMENT: {task['verification_requirement']}",
              "CHANGED: true",
              "VERIFIED: controller smoke test",
              "UNVERIFIED: none",
              "OBSERVED_EFFECT: Canonical result template validated.",
              "UNCERTAINTY_TARGETED: result handoff reliability",
              "UNCERTAINTY_REDUCED: yes",
              "DECISION: IMPROVE",
              "NEXT: Keep using the pre-created canonical result template.",
          ]
          result_path.write_text("\n".join(result) + "\n", encoding="utf-8")

          deep_path = Path(".github/scripts/deep_workflow_audit.py")
          spec = importlib.util.spec_from_file_location("deep_audit", deep_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.SECRET_TEXT_RE.search("sk-" + "a" * 32)
          assert module.SECRET_TEXT_RE.search("kilo_" + "a" * 32)
          assert not module.SECRET_TEXT_RE.search("task-11-task-selection-bias-df5ed80051")
          print("Result-contract template and credential-scanner boundary regression passed.")
          PY

          python3 .github/scripts/campaign_controller.py validate-result             --task "$TEST_ROOT/state/campaign/TASK.json"             --result "$TEST_ROOT/state/campaign/RESULT.md"

      - name: Prepare isolated dummy campaign state
        run: |
          set -euo pipefail
          EHB_WORKER_DIR="$RUNNER_TEMP/ehb-worker"
          SNAP="$RUNNER_TEMP/ehb-research-snapshot"
          SMOKE_ROOT="$RUNNER_TEMP/ehb-smoke-root"
          rm -rf "$EHB_WORKER_DIR" "$SNAP" "$SMOKE_ROOT"
          mkdir -p \
            "$EHB_WORKER_DIR/state/research" \
            "$EHB_WORKER_DIR/reports" \
            "$EHB_WORKER_DIR/state/campaign" \
            "$SNAP" \
            "$SMOKE_ROOT/state/research" \
            "$SMOKE_ROOT/reports"

          for file in \
            AGENTS.md \
            ENTERPRISE.md \
            PERSISTENCE_POLICY.md \
            AUTHORIZED_TARGET.md \
            SOLVER_FEEDBACK.md \
            LEARNING_STATE.md \
            research_state.md \
            README.md; do
            if [ -e "$file" ]; then
              cp -a "$file" "$EHB_WORKER_DIR/$file"
            fi
          done

          if [ -e ".kilo/wakeup-prompt.md" ]; then
            mkdir -p "$EHB_WORKER_DIR/.kilo"
            cp -a ".kilo/wakeup-prompt.md" "$EHB_WORKER_DIR/.kilo/wakeup-prompt.md"
          fi

          if [ -e "state/campaign/GLOBAL_AGENT_COUNTER.json" ]; then
            cp -a "state/campaign/GLOBAL_AGENT_COUNTER.json" "$EHB_WORKER_DIR/state/campaign/GLOBAL_AGENT_COUNTER.json"
          fi

          cat > "$EHB_WORKER_DIR/state/research/PROGRAM.json" <<'EOF'
          {
            "program_version": "1.0.0",
            "benchmark_id": "dummy-smoke",
            "evolution_families": [
              {"family_id": "smoke-family", "status": "ACTIVE", "generation": 1}
            ],
            "surfaces": [
              {"surface_id": "smoke-surface", "status": "ACTIVE"}
            ]
          }
          EOF

          cat > "$EHB_WORKER_DIR/state/research/PORTFOLIO_SUMMARY.json" <<'EOF'
          {
            "candidate_requests": 10,
            "behavioral_differences": 4,
            "repeat_reproductions": 2,
            "executed_generations": 10,
            "families_represented": ["smoke-family"],
            "surfaces_represented": ["smoke-surface"]
          }
          EOF

          cp -a "$EHB_WORKER_DIR/state/research/." "$SNAP/"
          printf 'smoke\n' > "$SMOKE_ROOT/state/research/README.txt"

          {
            echo "EHB_WORKER_DIR=$EHB_WORKER_DIR"
            echo "SMOKE_ROOT=$SMOKE_ROOT"
          } >> "$GITHUB_ENV"

      - name: Run production controller with dummy executor
        run: |
          set -euo pipefail
          export EHB_WORKER_DIR="$RUNNER_TEMP/ehb-worker"
          export CAMPAIGN_DUMMY=true
          export BENCHMARK_ID=dummy-smoke
          export SECURITY_RESEARCH_TARGET=authorized-smoke-fixture
          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE"
          bash .github/scripts/run_security_campaign.sh

          test -s "$RUNNER_TEMP/ehb-campaign-context/CAMPAIGN_CONTEXT.md"
          grep -Fq "## Execution environment awareness" "$RUNNER_TEMP/ehb-campaign-context/CAMPAIGN_CONTEXT.md"
          grep -Fq "Kilo gateway relay: infrastructure only" "$RUNNER_TEMP/ehb-campaign-context/CAMPAIGN_CONTEXT.md"
          grep -Fq "Do not confuse relay/controller/worker-generated errors with target responses." "$RUNNER_TEMP/ehb-campaign-context/CAMPAIGN_CONTEXT.md"

          test -s "$EHB_WORKER_DIR/state/campaign/campaign_status.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EHB_WORKER_DIR"])
          status = json.loads((root / "state/campaign/campaign_status.json").read_text())
          assert status["status"] == "PARTIAL", status
          assert status["agent_count"] == 10, status
          assert status["success_count"] == 9, status
          assert status["failure_count"] == 1, status
          assert status["final_agent_status"] == "SUCCESS", status
          assert status["starting_agent_number"] == 11, status
          assert status["ending_agent_number"] == 20, status

          manifest = json.loads((root / "state/campaign/CAMPAIGN_MANIFEST.json").read_text())
          assert manifest["starting_agent_number"] == 11, manifest
          assert manifest["ending_agent_number"] == 20, manifest

          results = sorted((root / "state/campaign").glob("agent_*_RESULT.md"))
          tasks = sorted((root / "state/campaign").glob("agent_*_TASK.json"))
          controllers = sorted((root / "state/campaign").glob("agent_*_CONTROLLER.md"))
          sessions = sorted((root / "state/campaign").glob("agent_*_MOCK_SESSION_ID"))
          assert len(results) == 10, len(results)
          assert len(tasks) == 10, len(tasks)
          assert len(controllers) == 10, len(controllers)
          assert len(sessions) == 10, len(sessions)
          assert len({p.read_text().strip() for p in sessions}) == 10

          import json
          roles = {}
          for path in tasks:
              task = json.loads(path.read_text(encoding="utf-8"))
              number = int(task["agent_number"])
              roles[number] = task["role"]
              assert task["task_id"].startswith("task-")
              for field in (
                  "primary_question", "bottleneck", "information_gap",
                  "bounded_action", "deliverable", "success_evidence_criterion",
                  "stop_condition", "out_of_scope", "verification_requirement",
              ):
                  assert task[field].strip(), (path, field)
          assert roles[11] == "LEARNING_PROCESS"
          assert roles[12] == "HIGHER_ORDER_RESEARCH"
          assert roles[13] == "LEARNING_PROCESS"
          assert roles[14] == "HIGHER_ORDER_RESEARCH"
          assert roles[19] == "LEARNING_PROCESS"
          assert roles[20] == "HIGHER_ORDER_RESEARCH"

          for path in results:
              text = path.read_text(encoding="utf-8")
              for field in (
                  "OUTCOME_CLASS:", "TASK_ID:", "PRIMARY_QUESTION:", "BOTTLENECK:",
                  "INFORMATION_GAP:", "BOUNDED_ACTION:", "DELIVERABLE:",
                  "SUCCESS_EVIDENCE_CRITERION:", "STOP_CONDITION:", "OUT_OF_SCOPE:",
                  "VERIFICATION_REQUIREMENT:", "CHANGED:", "VERIFIED:", "UNVERIFIED:",
                  "OBSERVED_EFFECT:", "UNCERTAINTY_TARGETED:", "UNCERTAINTY_REDUCED:",
                  "DECISION:", "NEXT:",
              ):
                  assert field in text, (path, field)

          agent14_task = json.loads((root / "state/campaign/agent_14_TASK.json").read_text())
          agent13_task = json.loads((root / "state/campaign/agent_13_TASK.json").read_text())
          assert agent14_task["selection_basis"]["previous_task_id"] == agent13_task["task_id"]
          assert (root / "state/campaign/FINAL_SYNTHESIS.json").is_file()
          assert (root / "state/campaign/FINAL_SYNTHESIS.md").is_file()

          assert (root / "PROGRAM_PROPOSAL.json").is_file()
          assert (root / "reports/benchmark_findings.json").is_file()
          assert (root / "reports/benchmark_research.md").is_file()
          print("Dummy first campaign orchestration contract passed: global Agents 11-20.")
          PY

          CROSS_RUN_ROOT="$RUNNER_TEMP/ehb-cross-run"
          NEXT_CONTEXT="$RUNNER_TEMP/ehb-next-campaign-context"
          rm -rf "$CROSS_RUN_ROOT" "$NEXT_CONTEXT"
          cp -a "$EHB_WORKER_DIR/." "$CROSS_RUN_ROOT/"
          mkdir -p "$NEXT_CONTEXT"

          python3 .github/scripts/campaign_controller.py start-campaign             --root "$CROSS_RUN_ROOT"             --campaign-id dummy-smoke-second

          python3 .github/scripts/campaign_controller.py prepare-agent             --root "$CROSS_RUN_ROOT"             --agent-root "$CROSS_RUN_ROOT"             --context-dir "$NEXT_CONTEXT"             --campaign-slot 1
          cp "$CROSS_RUN_ROOT/state/campaign/TASK.json" "$CROSS_RUN_ROOT/state/campaign/SECOND_SLOT_01_TASK.json"

          python3 .github/scripts/campaign_controller.py prepare-agent             --root "$CROSS_RUN_ROOT"             --agent-root "$CROSS_RUN_ROOT"             --context-dir "$NEXT_CONTEXT"             --campaign-slot 10
          cp "$CROSS_RUN_ROOT/state/campaign/TASK.json" "$CROSS_RUN_ROOT/state/campaign/SECOND_SLOT_10_TASK.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "ehb-cross-run"
          slot1 = json.loads((root / "state/campaign/SECOND_SLOT_01_TASK.json").read_text())
          slot10 = json.loads((root / "state/campaign/SECOND_SLOT_10_TASK.json").read_text())
          manifest = json.loads((root / "state/campaign/CAMPAIGN_MANIFEST.json").read_text())
          counter = json.loads((root / "state/campaign/GLOBAL_AGENT_COUNTER.json").read_text())

          assert manifest["starting_agent_number"] == 21, manifest
          assert manifest["ending_agent_number"] == 30, manifest
          assert slot1["agent_number"] == 21, slot1
          assert slot1["campaign_slot"] == 1, slot1
          assert slot1["role"] == "LEARNING_PROCESS", slot1
          assert slot10["agent_number"] == 30, slot10
          assert slot10["campaign_slot"] == 10, slot10
          assert slot10["role"] == "HIGHER_ORDER_RESEARCH", slot10
          assert counter["next_agent_number"] == 31, counter
          print("Cross-campaign global agent sequencing passed: 11-20 -> 21-30.")

      - name: Regression-test global-agent memo isolation
        run: |
          set -euo pipefail
          BOUNDARY_ROOT="$RUNNER_TEMP/ehb-agent-boundary"
          BOUNDARY_CONTEXT="$RUNNER_TEMP/ehb-agent-boundary-context"
          rm -rf "$BOUNDARY_ROOT" "$BOUNDARY_CONTEXT"
          mkdir -p "$BOUNDARY_ROOT/state/campaign" "$BOUNDARY_CONTEXT"
          cat > "$BOUNDARY_ROOT/state/campaign/GLOBAL_AGENT_COUNTER.json" <<'EOF'
          {
            "schema_version": 1,
            "next_agent_number": 91,
            "last_reserved_campaign_id": null,
            "last_reserved_ending_agent_number": 90
          }
          EOF

          python3 .github/scripts/campaign_controller.py start-campaign             --root "$BOUNDARY_ROOT" --campaign-id boundary-one >/dev/null
          python3 .github/scripts/campaign_controller.py start-campaign             --root "$BOUNDARY_ROOT" --campaign-id boundary-two >/dev/null

          cat > "$BOUNDARY_ROOT/state/campaign/agent_099_RESULT.md" <<'EOF'
          TASK_ID: task-99-stale
          DECISION: RETAIN
          OBSERVED_EFFECT: stale prior-campaign memo
          NEXT: stale next action
          EOF
          cat > "$BOUNDARY_ROOT/state/campaign/agent_100_RESULT.md" <<'EOF'
          TASK_ID: task-100-stale
          DECISION: RETAIN
          OBSERVED_EFFECT: stale prior-campaign memo
          NEXT: stale next action
          EOF

          python3 .github/scripts/campaign_controller.py prepare-agent             --root "$BOUNDARY_ROOT" --agent-root "$BOUNDARY_ROOT"             --context-dir "$BOUNDARY_CONTEXT" --campaign-slot 1 >/dev/null

          cp "$BOUNDARY_ROOT/state/campaign/TASK.json"              "$BOUNDARY_ROOT/state/campaign/agent_101_TASK.json"
          cat > "$BOUNDARY_ROOT/state/campaign/agent_101_RESULT.md" <<'EOF'
          TASK_ID: task-101-current
          DECISION: IMPROVE
          OBSERVED_EFFECT: current campaign memo
          NEXT: current next action
          EOF

          python3 .github/scripts/campaign_controller.py prepare-agent             --root "$BOUNDARY_ROOT" --agent-root "$BOUNDARY_ROOT"             --context-dir "$BOUNDARY_CONTEXT" --campaign-slot 2 >/dev/null

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ehb-agent-boundary"
          task = json.loads((root / "state/campaign/TASK.json").read_text(encoding="utf-8"))
          assert task["agent_number"] == 102, task
          assert task["selection_basis"]["previous_task_id"] == "task-101-current", task
          print("Campaign-local memo scoping and numeric global-agent ordering passed at 99-102 boundary.")
          PY



      - name: Regression-test corrupt campaign-state fail-closed behavior
        run: |
          set -euo pipefail
          BAD_ROOT="$RUNNER_TEMP/ehb-bad-campaign-state"
          rm -rf "$BAD_ROOT"
          mkdir -p "$BAD_ROOT/state/campaign"

          cat > "$BAD_ROOT/state/campaign/GLOBAL_AGENT_COUNTER.json" <<'EOF'
          {
            "schema_version": 1,
            "next_agent_number": "not-a-number"
          }
          EOF
          if python3 .github/scripts/campaign_controller.py start-campaign               --root "$BAD_ROOT" --campaign-id bad-counter >/dev/null 2>&1; then
            echo "Corrupt counter was incorrectly accepted."
            exit 1
          fi

          printf '%s\n' '{"campaign_id":"bad-manifest","agent_count":10}'             > "$BAD_ROOT/state/campaign/CAMPAIGN_MANIFEST.json"
          cat > "$BAD_ROOT/state/campaign/GLOBAL_AGENT_COUNTER.json" <<'EOF'
          {
            "schema_version": 1,
            "next_agent_number": 31
          }
          EOF
          if python3 .github/scripts/campaign_controller.py start-campaign               --root "$BAD_ROOT" --campaign-id bad-manifest >/dev/null 2>&1; then
            echo "Corrupt idempotent manifest was incorrectly accepted."
            exit 1
          fi

          rm -f "$BAD_ROOT/state/campaign/CAMPAIGN_MANIFEST.json"
          rm -f "$BAD_ROOT/state/campaign/GLOBAL_AGENT_COUNTER.json"
          if python3 .github/scripts/campaign_controller.py start-campaign               --root "$BAD_ROOT" --campaign-id missing-counter >/dev/null 2>&1; then
            echo "Missing counter was incorrectly treated as Agent 1."
            exit 1
          fi
          echo "Corrupt campaign-state fail-closed regression passed."

      - name: Regression-test stale program handoff isolation
        run: |
          set -euo pipefail
          STALE_ROOT="$RUNNER_TEMP/ehb-stale-handoff"
          rm -rf "$STALE_ROOT"
          mkdir -p "$STALE_ROOT/state/campaign" "$STALE_ROOT/reports"
          cp -a "$EHB_WORKER_DIR/state/campaign/agent_"* "$STALE_ROOT/state/campaign/"
          cp -a "$EHB_WORKER_DIR/state/campaign/CAMPAIGN_MANIFEST.json" "$STALE_ROOT/state/campaign/"
          cat > "$STALE_ROOT/PROGRAM_PROPOSAL.json" <<'EOF'
          {"stale": true, "source": "previous-campaign"}
          EOF
          rm -f "$STALE_ROOT/PROGRAM_PROPOSAL_CANDIDATE.json"
          python3 .github/scripts/finalize_campaign.py prepare --root "$STALE_ROOT"
          test ! -e "$STALE_ROOT/PROGRAM_PROPOSAL.json"
          echo "Stale program handoff isolation passed."

      - name: Evaluate fast process-health path
        run: |
          set -euo pipefail
          SMOKE_ROOT="$RUNNER_TEMP/ehb-smoke-root"
          EHB_WORKER_DIR="$RUNNER_TEMP/ehb-worker"

          mkdir -p "$SMOKE_ROOT/context" "$SMOKE_ROOT/state/campaign"
          cp -a "$EHB_WORKER_DIR/state/research/PROGRAM.json" "$SMOKE_ROOT/state/research/PROGRAM.json"
          cp -a "$EHB_WORKER_DIR/state/research/PORTFOLIO_SUMMARY.json" "$SMOKE_ROOT/state/research/PORTFOLIO_SUMMARY.json"
          cp -a "$EHB_WORKER_DIR/reports/benchmark_findings.json" "$SMOKE_ROOT/reports/benchmark_findings.json"
          cp -a "$EHB_WORKER_DIR/PROGRAM_PROPOSAL.json" "$SMOKE_ROOT/PROGRAM_PROPOSAL.json"
          cp -a "$RUNNER_TEMP/ehb-campaign-context/." "$SMOKE_ROOT/context/"

          cat > "$SMOKE_ROOT/reports/benchmark_dummy-smoke.json" <<'EOF'
          {
            "ground_truth_exposed": false,
            "overall_score": 0.05,
            "discovery_rate": 0.0,
            "reproduction_rate": 0.0,
            "precision_component": 0.0,
            "evidence_quality": 1.0,
            "finding_count_submitted": 0,
            "reproduced_claim_count": 0,
            "unmatched_claim_count": 0,
            "unique_challenges_validated": 0
          }
          EOF

          cd "$SMOKE_ROOT"
          python3 "$GITHUB_WORKSPACE/.github/scripts/build_campaign_health.py" \
            --output state/campaign/HEALTH.json \
            --campaign-status PARTIAL \
            --evaluate success \
            --preflight success \
            --smoke success \
            --persist success \
            --context-dir "$SMOKE_ROOT/context" \
            --result "$SMOKE_ROOT/reports/benchmark_dummy-smoke.json" \
            --findings "$SMOKE_ROOT/reports/benchmark_findings.json" \
            --proposal "$SMOKE_ROOT/PROGRAM_PROPOSAL.json" \
            --process-history "$SMOKE_ROOT/state/research/PROCESS_HISTORY.jsonl"

          python3 "$GITHUB_WORKSPACE/lab/generate_solver_feedback.py" \
            --result "$SMOKE_ROOT/reports/benchmark_dummy-smoke.json" \
            --history "$GITHUB_WORKSPACE/lab/benchmark_history.jsonl" \
            --process-history "$SMOKE_ROOT/state/research/PROCESS_HISTORY.jsonl" \
            --output "$SMOKE_ROOT/SOLVER_FEEDBACK.md"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SMOKE_ROOT"])
          health = json.loads((root / "state/campaign/HEALTH.json").read_text())
          assert health["agent_result_count"] == 10, health
          assert 0.0 < health["process_score"] <= 1.0, health
          assert set(health["process_metrics"]) == {
              "execution_reliability",
              "agent_completion",
              "memo_integrity",
              "task_contract_integrity",
              "alternating_role_integrity",
              "hypothesis_diversity",
              "learning_yield",
              "falsification_coverage",
              "observed_effect_rate",
              "uncertainty_reduction_rate",
              "research_breadth",
              "reproduction_density",
              "handoff_completeness",
          }, health["process_metrics"].keys()
          assert health["process_metrics"]["alternating_role_integrity"] == 1.0
          assert health["process_metrics"]["task_contract_integrity"] > 0.0
          assert health["benchmark"]["overall_score"] == 0.05
          assert health["research_health"] == "PROGRESS"
          assert (root / "SOLVER_FEEDBACK.md").is_file()
          text = (root / "SOLVER_FEEDBACK.md").read_text(encoding="utf-8")
          assert "Process score" in text
          for label in (
              "Execution reliability:",
              "Agent completion:",
              "Memo integrity:",
              "Task contract integrity:",
              "Alternating role integrity:",
              "Hypothesis diversity:",
              "Learning yield:",
              "Falsification coverage:",
              "Observed effect rate:",
              "Uncertainty reduction rate:",
              "Research breadth:",
              "Reproduction density:",
              "Handoff completeness:",
          ):
              assert label in text, label
          print(f"FAST_SMOKE_PROCESS_SCORE={health['process_score']}")
          print("Fast process-health evaluation passed.")
          PY

      - name: Publish smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-smoke-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ehb-smoke-root/state/campaign/HEALTH.json
            ${{ runner.temp }}/ehb-smoke-root/SOLVER_FEEDBACK.md
            ${{ runner.temp }}/ehb-smoke-root/context/agent_*_RESULT.md
            ${{ runner.temp }}/ehb-worker/state/campaign/campaign_status.json

