name: Bug Bounty Research Enterprise Wake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bug-bounty-research-enterprise
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  worker:
    name: Autonomous security-research activation
    runs-on: ubuntu-24.04
    timeout-minutes: 355


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test benchmark harness
        run: |
          set -euo pipefail
          python3 lab/test_benchmark.py

      - name: Discover current free model
        id: discover_model
        run: |
          set -euo pipefail
          python3 -c '
          import json, os
          from urllib.request import Request, urlopen

          request = Request("https://api.kilo.ai/api/gateway/models",
                            headers={"Accept": "application/json"})
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)

          models = payload.get("data", [])
          free = [m for m in models
                  if isinstance(m.get("id"), str) and m["id"].endswith(":free")]

          preferred = [
              "minimax/minimax-m2.1:free",
              "z-ai/glm-5:free",
          ]

          selected = next(
              (m for model_id in preferred for m in free if m.get("id") == model_id),
              None
          )

          if selected is None:
              def tool_capable(model):
                  params = model.get("supported_parameters") or []
                  return bool(
                      model.get("tool_calling")
                      or model.get("tool_call")
                      or any(str(v).lower() in {"tools", "tool_choice"} for v in params)
                  )

              candidates = sorted(
                  [m for m in free if tool_capable(m)],
                  key=lambda m: m.get("id", "")
              )
              selected = candidates[0] if candidates else None

          if selected is None:
              raise SystemExit("No suitable tool-capable free Kilo model was found.")

          model_id = selected["id"]
          model_name = selected.get("name") or model_id

          with open("/tmp/kilo-free-model-name", "w", encoding="utf-8") as f:
              f.write(model_name)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"KILO_FREE_MODEL_ID={model_id}\n")

          print(f"Selected current free model: {model_id}")
          '

      - name: Prepare trusted Kilo configuration
        run: |
          set -euo pipefail
          python3 -c '
          import json, os
          from pathlib import Path

          model_id = os.environ["KILO_FREE_MODEL_ID"]
          model_name = Path("/tmp/kilo-free-model-name").read_text(encoding="utf-8")

          config = {
              "$schema": "https://app.kilo.ai/config.json",
              "enabled_providers": ["openai-compatible"],
              "model": "openai-compatible/free-kilo",
              "small_model": "openai-compatible/free-kilo",
              "subagent_model": "openai-compatible/free-kilo",
              "provider": {
                  "openai-compatible": {
                      "options": {
                          "baseURL": "https://api.kilo.ai/api/gateway"
                      },
                      "models": {
                          "free-kilo": {
                              "id": model_id,
                              "name": model_name,
                              "tool_call": True
                          }
                      }
                  }
              },
              "sandbox": {
                  "enabled": False,
                  "network": "allow",
                  "allowed_hosts": [
                      "github.com:443",
                      "api.github.com:443",
                      "raw.githubusercontent.com:443",
                      "api.kilo.ai:443",
                      "pypi.org:443",
                      "files.pythonhosted.org:443",
                      "registry.npmjs.org:443"
                  ]
              }
          }

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          os.chmod(path, 0o600)
          '

      - name: Validate trusted Kilo configuration
        run: |
          set -euo pipefail
          test "$(stat -c "%a" "$HOME/.config/kilo/kilo.json")" = "600"
          python3 -c '
          import json, os
          from pathlib import Path

          path = Path(os.environ["HOME"]) / ".config" / "kilo" / "kilo.json"
          config = json.loads(path.read_text(encoding="utf-8"))

          assert config["model"] == "openai-compatible/free-kilo"
          assert config["small_model"] == "openai-compatible/free-kilo"
          assert config["subagent_model"] == "openai-compatible/free-kilo"
          gateway = config["provider"]["openai-compatible"]
          assert "apiKey" not in gateway["options"]
          assert gateway["models"]["free-kilo"]["id"].endswith(":free")
          assert config["sandbox"]["enabled"] is False
          print("Trusted Kilo configuration validated.")
          '

      - name: Build isolated Kilo worker image
        run: |
          set -euo pipefail
          export EHB_KILO_IMAGE="ehb-kilo:${GITHUB_RUN_ID}"
          docker build --pull -t "$EHB_KILO_IMAGE" -f lab/kilo-worker.Dockerfile lab
          echo "EHB_KILO_IMAGE=$EHB_KILO_IMAGE" >> "$GITHUB_ENV"
      - name: Generate fresh hidden benchmark
        id: benchmark
        run: |
          set -euo pipefail
          export LAB_SECRET_DIR="$RUNNER_TEMP/ehb-secret"
          export EHB_WORKER_DIR="$RUNNER_TEMP/ehb-worker"
          mkdir -p "$LAB_SECRET_DIR"
          chmod 700 "$LAB_SECRET_DIR"
          python3 lab/generate_benchmark.py --secret-dir "$LAB_SECRET_DIR" --history "lab/benchmark_history.jsonl"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["LAB_SECRET_DIR"], "public.json").read_text(encoding="utf-8"))
          print(f"BENCHMARK_ID={data['benchmark_id']}")
          print(f"BENCHMARK_COMMITMENT={data['commitment']}")
          print(f"BENCHMARK_DIFFICULTY={data['difficulty']}")
          print("SECURITY_RESEARCH_TARGET=http://lab-mutator:3000")
          print(f"LAB_SECRET_DIR={os.environ['LAB_SECRET_DIR']}")
          print(f"EHB_WORKER_DIR={os.environ['EHB_WORKER_DIR']}")
          PY

      - name: Start isolated benchmark environment
        run: |
          set -euo pipefail
          docker network create --internal ehb-target-net
          docker network create --internal ehb-worker-net
          docker network create ehb-egress-net

          docker run -d \
            --name ehb-kilo-egress \
            --network ehb-egress-net \
            --mount type=bind,source="$GITHUB_WORKSPACE/lab/kilo_gateway_proxy.py",target=/app/proxy.py,readonly \
            python:3.12-alpine \
            python /app/proxy.py

          docker network connect --alias api.kilo.ai ehb-worker-net ehb-kilo-egress
          docker run -d \
            --name juice-shop \
            --network ehb-target-net \
            bkimminich/juice-shop:20.2.0

          docker run -d \
            --name lab-mutator \
            --network ehb-target-net \
            --read-only \
            --tmpfs /tmp \
            --mount type=bind,source="$LAB_SECRET_DIR",target=/run/lab,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/lab",target=/app,readonly \
            python:3.12-alpine \
            python /app/mutator.py --spec /run/lab/spec.json --upstream-host juice-shop

          docker network connect ehb-worker-net lab-mutator

          docker run --rm --network ehb-worker-net \
            "$EHB_KILO_IMAGE" \
            bash -lc 'curl --fail --silent --show-error https://api.kilo.ai/api/gateway/models >/dev/null && echo "Kilo gateway network path is ready."'

          docker run --rm --network ehb-worker-net \
            "$EHB_KILO_IMAGE" \
            python3 -c 'import urllib.request; print(urllib.request.urlopen("http://lab-mutator:3000/__lab__/health", timeout=20).read().decode())'

      - name: Prepare blind worker workspace
        run: |
          set -euo pipefail
          rm -rf "$EHB_WORKER_DIR"
          mkdir -p "$EHB_WORKER_DIR"
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="lab/" \
            --exclude="reports/benchmark_*.json" \
            "$GITHUB_WORKSPACE/" "$EHB_WORKER_DIR/"

      - name: Run isolated Kilo worker
        id: kilo
        continue-on-error: true
        timeout-minutes: 315
        env:
          KILO_DISABLE_EXTERNAL_SKILLS: "true"
        run: |
          set -euo pipefail
          docker run --rm \
            --name ehb-kilo \
            --network ehb-worker-net \
            --mount type=bind,source="$EHB_WORKER_DIR",target=/workspace \
            --mount type=bind,source="$HOME/.config/kilo/kilo.json",target=/root/.config/kilo/kilo.json,readonly \
            -e HOME=/root \
            -e KILO_DISABLE_EXTERNAL_SKILLS=true \
            -e BENCHMARK_ID="$BENCHMARK_ID" \
            -e SECURITY_RESEARCH_TARGET="$SECURITY_RESEARCH_TARGET" \
            "$EHB_KILO_IMAGE" \
            bash -lc '
              set -euo pipefail
              cd /workspace
              kilo run --model openai-compatible/free-kilo --auto "$(cat .kilo/wakeup-prompt.md)"
            '

      - name: Merge safe worker results back
        if: always()
        run: |
          set -euo pipefail
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".kilo/" \
            --exclude="lab/" \
            --exclude="AUTHORIZED_TARGET.md" \
            --exclude="HARDCORE_BENCHMARK.md" \
            "$EHB_WORKER_DIR/" "$GITHUB_WORKSPACE/"

      - name: Evaluate hidden benchmark independently
        id: evaluate
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --mount type=bind,source="$LAB_SECRET_DIR",target=/run/lab,readonly \
            python:3.12-alpine \
            python /workspace/lab/evaluate_benchmark.py \
              --spec /run/lab/spec.json \
              --public /run/lab/public.json \
              --workspace /workspace

      - name: Preserve manual-dispatch forensic benchmark
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BENCHMARK_ID }}-hidden-benchmark
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.LAB_SECRET_DIR }}/spec.json
            ${{ env.LAB_SECRET_DIR }}/public.json
            reports/benchmark_${{ env.BENCHMARK_ID }}.json
      - name: Cleanup isolated benchmark environment
        if: always()
        run: |
          set +e
          docker rm -f ehb-kilo ehb-kilo-egress lab-mutator juice-shop >/dev/null 2>&1 || true
          docker network rm ehb-target-net ehb-worker-net ehb-egress-net >/dev/null 2>&1 || true
          docker image rm "$EHB_KILO_IMAGE" >/dev/null 2>&1 || true
          rm -rf "$LAB_SECRET_DIR" "$EHB_WORKER_DIR"

      - name: Persist safe repository changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KILO_OUTCOME: ${{ steps.kilo.outcome }}
        run: |
          set -euo pipefail

          git restore --worktree --staged -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md PERSISTENCE_POLICY.md AUTHORIZED_TARGET.md HARDCORE_BENCHMARK.md lab/generate_benchmark.py lab/mutator.py lab/evaluate_benchmark.py lab/test_benchmark.py lab/kilo-worker.Dockerfile lab/kilo_gateway_proxy.py lab/README.md 2>/dev/null || true
          git reset -- .github/workflows .kilo AGENTS.md ENTERPRISE.md MANUAL_SETUP.md PERSISTENCE_POLICY.md AUTHORIZED_TARGET.md HARDCORE_BENCHMARK.md lab/generate_benchmark.py lab/mutator.py lab/evaluate_benchmark.py lab/test_benchmark.py lab/README.md 2>/dev/null || true

          git add -A

          git reset -- \
            ":(glob)**/__pycache__/**" \
            ":(glob)**/*.pyc" \
            ":(glob)**/*.py.c" 2>/dev/null || true

          if git diff --cached --name-only | grep -E '(^|/)(\.github/workflows/|\.kilo/)|^(AGENTS\.md|ENTERPRISE\.md|MANUAL_SETUP\.md|PERSISTENCE_POLICY\.md|AUTHORIZED_TARGET\.md|HARDCORE_BENCHMARK\.md)$|^lab/(generate_benchmark\.py|mutator\.py|evaluate_benchmark\.py|test_benchmark\.py|kilo-worker\.Dockerfile|kilo_gateway_proxy\.py|README\.md)$' >/tmp/protected; then
            echo "Protected paths unexpectedly staged:"
            cat /tmp/protected
            exit 1
          fi

          if git diff --cached --name-only | grep -E '(^|/)(\.env(\..*)?|id_rsa|id_dsa|id_ecdsa|id_ed25519|credentials\.(json|ya?ml|toml)|secrets\.(json|ya?ml|toml))$|\.(pem|key)$' >/tmp/credential_paths; then
            echo "Credential-like paths are not allowed to persist:"
            cat /tmp/credential_paths
            exit 1
          fi

          if git diff --cached --summary | grep -E "^ create mode 120000 " >/tmp/symlinks; then
            echo "Symbolic links are not allowed to persist:"
            cat /tmp/symlinks
            exit 1
          fi

          if git diff --cached --binary | grep -E -n "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|kilo_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}" >/tmp/secrets; then
            echo "Potential credential material detected:"
            cat /tmp/secrets
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No safe repository changes to persist."
            exit 0
          fi

          git config user.name "security-research-enterprise"
          git config user.email "security-research-enterprise@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git commit -m "Persist security research activation"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

          echo "Worker activation outcome: $KILO_OUTCOME"

      - name: Report worker outcome
        if: always()
        env:
          KILO_OUTCOME: ${{ steps.kilo.outcome }}
        run: |
          if [ "$KILO_OUTCOME" = "success" ]; then
            echo "Worker activation completed successfully."
          elif [ "$KILO_OUTCOME" = "skipped" ]; then
            echo "Worker activation was skipped."
          else
            echo "Worker activation ended with outcome: $KILO_OUTCOME"
            exit 1
          fi
