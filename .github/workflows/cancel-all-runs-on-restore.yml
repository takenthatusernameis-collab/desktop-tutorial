name: One-time cancel all Desktop Tutorial runs

on:
  push:
    paths:
      - ".github/workflows/cancel-all-runs-on-restore.yml"
      - ".github/workflows/kilo-wakeup.yml"

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Cancel every non-completed Actions run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"

          gh api --paginate "repos/${repo}/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.id != '"$current"' and .status != "completed") | .id'             | sort -u             | while read -r run_id; do
                [ -n "${run_id}" ] || continue
                echo "Cancelling run ${run_id}"
                gh api --method POST "repos/${repo}/actions/runs/${run_id}/cancel" >/dev/null || true
              done

      - name: Persist cancellation receipt
        run: |
          set -euo pipefail
          printf 'cancelled_by_run=%s\ncommit=%s\ncompleted_utc=%s\n'             "${GITHUB_RUN_ID}"             "${GITHUB_SHA}"             "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             > .github/CANCEL_ALL_RUNS_COMPLETE

          git config user.name "desktop-tutorial-run-canceller"
          git config user.email "desktop-tutorial-run-canceller@users.noreply.github.com"
          git add .github/CANCEL_ALL_RUNS_COMPLETE
          git commit -m "Record cancellation barrier completion"
          git push

      - name: Self-delete after restore-triggered cancellation
        if: contains(github.event.head_commit.message, 'Restore Desktop Tutorial workflow to last successful pre-10-agent state')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/cancel-all-runs-on-restore.yml
          git config user.name "desktop-tutorial-run-canceller"
          git config user.email "desktop-tutorial-run-canceller@users.noreply.github.com"
          git add -u .github/workflows/cancel-all-runs-on-restore.yml
          git commit -m "Remove one-time cancellation workflow"
          git push
